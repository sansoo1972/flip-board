<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Incident Counter</title>
  <link rel="stylesheet" href="./flip.css" />
</head>
<body>
  <div class="board"></div>

  <script type="module">
    import { createFlipBoard } from './flip.js'

    const board = createFlipBoard({
      boardSelector: '.board',
      columns: 16,
      theme: 'dark',
      perspective: 1,
      sound: true,
    })

    function getColorForDays(days) {
      if (days < 10) return 'hsl(0, 100%, 50%)'
      if (days < 30) return 'hsl(44, 100%, 50%)'
      return 'hsl(120, 60%, 40%)'
    }

    async function renderIncidentBoard() {
      const response = await fetch('./incident.json')
      if (!response.ok) {
        throw new Error(`Failed to load incident.json: HTTP ${response.status}`)
      }

      const data = await response.json()

      const dates = Object.entries(data)
        .filter(([key]) => key.startsWith('incident.') && key.endsWith('.date'))
        .map(([, value]) => new Date(value))
        .filter((d) => !Number.isNaN(d.getTime()))

      if (!dates.length) {
        throw new Error('No valid incident dates found in incident.json')
      }

      const lastIncidentDate = new Date(
        Math.max(...dates.map((d) => d.getTime()))
      )

      const now = new Date()
      const diffDays = Math.floor(
        (now - lastIncidentDate) / (1000 * 60 * 60 * 24)
      )

      board.renderLines([
        { text: 'Days Since' },
        { text: 'Last Major' },
        { text: 'Incident' },
        { text: 'Caused by IAM:' },
        { text: String(diffDays), pad: 1, color: getColorForDays(diffDays) },
      ])
    }

    renderIncidentBoard().catch((error) => {
      console.error('Error rendering incident board:', error)

      board.renderLines([
        { text: 'Error Loading' },
        { text: 'incident.json', color: 'hsl(0, 100%, 50%)' },
      ])
    })
  </script>
</body>
</html>
