        const DEFAULT_CHARACTERS =
            "abcdefghijklmnopqrstuvwxyz0123456789 .!:?/\\|[]{}@#$%^&*()\"'`~<>";

        class FlipSlot {
            constructor(options = {}) {
                const {
                    characters = DEFAULT_CHARACTERS,
                    color = "canvasText",
                    pad = 0,
                } = options;
                this.characters = Array.from(` ${characters} `);
                this.colorSet = color;
                this.pad = pad;
                this.element = this.create();
                this.generateTimeline();
            }

            set chars(value) {
                this.characters = Array.from(` ${value} `);
                this.generateTimeline();
            }

            set color(value) {
                this.element?.style.setProperty("--color", value);
            }

            create() {
                const element = Object.assign(document.createElement('div'), {
                    className: 'flip',
                    style: `--color: ${this.colorSet}`,
                    innerHTML: `
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                    `,
                });
                return element;
            }

            flip(character, delay = 0) {
                const { characters: chars, pad, timeline, scrubber } = this;
                const currentIndex = chars.indexOf(chars[timeline.totalTime()]);
                const desiredIndex =
                    chars.indexOf(character) !== -1 ? chars.indexOf(character) : 0;
                const shift =
                    currentIndex > desiredIndex
                        ? chars.length - 1 - currentIndex + desiredIndex
                        : desiredIndex - currentIndex;
                const padding =
                    currentIndex === desiredIndex ? 0 : pad * (chars.length - 1);
                gsap.to(scrubber, {
                    delay,
                    totalTime: `+=${shift + padding}`,
                    ease: "power1.out",
                    duration: (shift + padding) * gsap.utils.random(0.02, 0.06),
                });
            }

            generateTimeline() {
                console.log('[generateTimeline] start', this.element);

                const panels = Array.from(this.element.querySelectorAll('div'));
                console.log('[generateTimeline] panels found:', panels.length, panels);

                const [unfoldTop, unfoldBottom, foldTop, foldBottom] = panels;

                if (panels.length !== 4) {
                    throw new Error(`Expected 4 flip panels, found ${panels.length}`);
                }

                const chars = this.characters;
                console.log('[generateTimeline] chars length:', chars.length, chars);

                gsap.set([foldTop, unfoldBottom], { clearProps: 'all' });
                unfoldTop.innerText = unfoldBottom.innerText = chars[1];
                foldTop.innerText = foldBottom.innerText = chars[0];

                const timeline = gsap
                    .timeline({
                        paused: true,
                        repeat: chars.length - 2,
                        onRepeat: () => {
                            const index = Math.floor(timeline.totalTime() / timeline.duration());
                            const next = chars[index % chars.length];
                            const current = chars[(index + 1) % chars.length];
                            unfoldTop.innerText = unfoldBottom.innerText = current;
                            foldTop.innerText = foldBottom.innerText = next;
                        },
                    })
                    .fromTo(unfoldBottom, { rotateX: 180 }, { rotateX: 0, duration: 1 }, 0)
                    .fromTo(unfoldTop, { filter: 'brightness(0)' }, { filter: 'brightness(1)', duration: 1 }, 0)
                    .fromTo(foldTop, { rotateX: 0 }, { rotateX: -180, duration: 1 }, 0)
                    .fromTo(foldBottom, { filter: 'brightness(1)' }, { filter: 'brightness(0)', duration: 1 }, 0);

                const duration = timeline.totalDuration();
                console.log('[generateTimeline] duration:', duration);

                this.scrubber = gsap.to(timeline, {
                    totalTime: duration,
                    repeat: -1,
                    paused: true,
                    duration: duration,
                    ease: 'none',
                });

                this.scrubber.time(timeline.totalDuration());
                this.timeline = timeline;

                console.log('[generateTimeline] done');
            }
        }

        class FlipLine {
            constructor(options = {}) {
                const { color, length = 16, pad = 0 } = options;
                this.colorSet = color;
                this.length = length;
                this.padding = pad;
                this.options = options;
                this.setup();
            }

            setup() {
                console.log('[FlipLine.setup] start', {
                    length: this.length,
                    padding: this.padding,
                    color: this.colorSet,
                });

                const { colorSet, length, padding } = this;

                if (this.element) {
                    this.element.innerHTML = '';
                } else {
                    this.element = Object.assign(document.createElement('div'), {
                        className: 'flip-line',
                    });
                }

                this.flips = [];
                for (let i = 0; i < length; i++) {
                    console.log('[FlipLine.setup] creating slot', i);
                    const newSlot = new FlipSlot({
                        pad: padding,
                        characters: DEFAULT_CHARACTERS,
                        color: colorSet,
                    });
                    this.element.appendChild(newSlot.element);
                    this.flips.push(newSlot);
                }

                console.log('[FlipLine.setup] done', this.flips.length);
            }

            run(update) {
                const letters = Array.from(update.padEnd(this.length, " "));
                for (let i = 0; i < Math.min(letters.length, this.length); i++) {
                    this.flips[i]?.flip(letters[i], i / 10);
                }
            }
        }

        const board = document.querySelector(".board");


        function getColorForDays(days) {
            if (days < 10) return "hsl(0, 100%, 50%)"; // Red
            if (days < 30) return "hsl(44, 100%, 50%)"; // Yellow
            return "hsl(120, 60%, 40%)"; // Green
        }

        function addLine(text, pad = 1, color = "hsl(0,0%,90%)") {
            const line = new FlipLine({ length: 16, pad, color });
            board.appendChild(line.element);
            line.run(text.toLowerCase());
        }

        // Fetch incident data from JSON file

        window.addEventListener("DOMContentLoaded", () => {
            fetch("incident.json")
                .then((response) => response.json())
                .then((data) => {
                    // Filter only keys that match the incident date pattern
                    const dateValues = Object.entries(data)
                        .filter(([key]) => key.startsWith("incident.") && key.endsWith(".date"))
                        .map(([, value]) => new Date(value));

                    // Find the most recent date
                    const lastIncidentDate = new Date(
                        Math.max(...dateValues.map((d) => d.getTime()))
                    );

                    const now = new Date();
                    const diffDays = Math.floor(
                        (now - lastIncidentDate) / (1000 * 60 * 60 * 24)
                    );

                    addLine("Days Since", 0);
                    addLine("Last Major", 0);
                    addLine("Incident", 0);
                    addLine("Caused by IAM:", 0);
                    addLine(diffDays.toString(), 1, getColorForDays(diffDays));
                })
                .catch((error) => {
                    console.error("Error loading incident data:", error);
                });
        });
